name: OSIMU Monitoring Feed

on:
  workflow_dispatch:
    inputs:
      seed_count:
        description: "Number of reports to publish now"
        required: true
        default: "1"
        type: string

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: osimu-monitoring-feed
  cancel-in-progress: false

jobs:
  post-report:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish OSIMU reports
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SEED_COUNT="${{ github.event.inputs.seed_count }}"

          if [ -z "$SEED_COUNT" ]; then
            SEED_COUNT="1"
          fi

          echo "Publishing $SEED_COUNT report(s)."
          python rss_bot.py --seed "$SEED_COUNT"

      - name: Save report history
        run: |
          if git diff --quiet state.json; then
            echo "No state changes were made."
            exit 0
          fi

          git config user.name "OSIMU Monitoring System"
          git config user.email "actions@users.noreply.github.com"

          git add state.json
          git commit -m "Update OSIMU monitoring state"
          git pull --rebase
          git push
